name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v7
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The project uses Xcode 27's project format, so use the newest Xcode on the runner.
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No available iPhone simulator" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $udid"
          echo "DESTINATION=id=$udid" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          xcodebuild test \
            -project Paisa.xcodeproj -scheme Paisa \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
